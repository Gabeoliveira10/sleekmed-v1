<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SleekMed | Apex Enterprise</title>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-bright: #F5E1A4;
            --bg: #050505;
            --surface: #0F0F0F;
            --border: #1A1A1A;
            --text-main: #FFFFFF;
            --text-muted: #666666;
        }
        
        body { background: var(--bg); color: var(--text-main); font-family: -apple-system, "SF Pro Display", sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
        .app-container { max-width: 500px; margin: 0 auto; padding: 20px 24px; }
        
        /* Global Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0 30px; }
        .logo { font-weight: 300; letter-spacing: 6px; text-transform: uppercase; font-size: 1rem; color: var(--gold); }
        .settings-icon { opacity: 0.5; cursor: pointer; }

        /* Search Interface */
        .search-area { position: relative; margin-bottom: 40px; }
        .search-input { width: 100%; padding: 22px; font-size: 1.1rem; background: var(--surface); color: #fff; border: 1px solid var(--border); border-radius: 12px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--gold); background: #000; box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }

        /* Live Dashboard */
        .section-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--text-muted); margin-bottom: 20px; display: flex; justify-content: space-between; }
        .live-dot { color: var(--gold); animation: pulse 2s infinite; }

        .data-card { background: linear-gradient(180deg, #111 0%, #080808 100%); border-radius: 16px; padding: 24px; margin-bottom: 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .drug-name { font-size: 1.3rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .drug-meta { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .price-grid { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .price-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.95rem; }
        .p-val { color: var(--gold); font-weight: 600; }

        /* Compliance Footer */
        .disclaimer { font-size: 0.65rem; color: #444; line-height: 1.6; text-align: center; padding: 40px 10px; border-top: 1px solid #111; margin-top: 40px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Nav */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,5,5,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 20px 0 40px; }
        .nav-item { color: var(--text-muted); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .nav-item.active { color: var(--gold); }

        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">SleekMed</div>
            <div class="settings-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
        </div>

        <div id="view-market">
            <div class="search-area">
                <input type="text" id="searchInput" class="search-input" placeholder="Query 2026 Drug Directory..." oninput="handleSearch()">
            </div>

            <div id="dashboard">
                <div class="section-header">
                    <span>Live Market Analytics</span>
                    <span class="live-dot">● Real-Time</span>
                </div>
                <div id="live-index">
                    </div>
            </div>

            <div class="disclaimer">
                SleekMed is a pricing intelligence platform. We are not a medical provider, pharmacy, or insurance entity. Content is for informational purposes only. Consult a healthcare professional for medical advice.
            </div>
        </div>

        <div id="view-card" class="hidden">
            </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="switchTab('market')">Intelligence</div>
        <div class="nav-item" onclick="switchTab('card')">Credentials</div>
    </div>

    <script>
        const medData = {
            "lipitor": { cat: "Cholesterol", GoodRx: 4.12, SingleCare: 5.50, CostPlus: 8.20 },
            "ozempic": { cat: "Weight Loss", GoodRx: 924.00, SingleCare: 938.00, CostPlus: 960.00 },
            "amoxicillin": { cat: "Antibiotic", GoodRx: 2.50, SingleCare: 3.10, CostPlus: 6.00 }
        };

        function renderCard(name, d) {
            return `
                <div class="data-card">
                    <div class="drug-name">${name}</div>
                    <div class="drug-meta">${d.cat} | 30-Day Supply</div>
                    <div class="price-grid">
                        <div class="price-row"><span>GoodRx Network</span><span class="p-val">$${d.GoodRx.toFixed(2)}</span></div>
                        <div class="price-row"><span>SingleCare</span><span class="p-val">$${d.SingleCare.toFixed(2)}</span></div>
                        <div class="price-row"><span>Cost Plus</span><span class="p-val">$${d.CostPlus.toFixed(2)}</span></div>
                    </div>
                </div>`;
        }

        function init() {
            let html = '';
            for (let [name, data] of Object.entries(medData)) {
                html += renderCard(name, data);
            }
            document.getElementById('live-index').innerHTML = html;
        }

        function handleSearch() {
            const val = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('live-index');
            if (!val) { init(); return; }
            if (medData[val]) {
                container.innerHTML = renderCard(val, medData[val]);
            } else {
                container.innerHTML = '<div style="text-align:center; padding:50px; color:#444;">Asset not found in current directory.</div>';
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SleekMed</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { margin-top: 60px; text-align: center; width: 100%; }
        h1 { font-weight: 200; letter-spacing: 5px; text-transform: uppercase; margin: 0; font-size: 1.5rem; }
        .status { color: #0f0; font-size: 0.7rem; letter-spacing: 2px; margin-top: 10px; opacity: 0.8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; margin-top: 50px; }
        .card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 15px; text-align: center; }
        .card span { display: block; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .card h2 { margin: 10px 0 0; font-weight: 400; font-size: 1.2rem; }
        .btn { width: 100%; max-width: 400px; background: #fff; color: #000; padding: 18px; border-radius: 30px; text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-top: 40px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SleekMed</h1>
        <div class="status">● SYSTEM ACTIVE</div>
    </div>
    <div class="grid">
        <div class="card"><span>Patients</span><h2>124</h2></div>
        <div class="card"><span>Revenue</span><h2>$12.4k</h2></div>
        <div class="card"><span>Staff</span><h2>8</h2></div>
        <div class="card"><span>Alerts</span><h2>0</h2></div>
    </div>
    <a href="#" class="btn">New Consult</a>
</body>
</html>
